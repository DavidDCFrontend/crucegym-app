<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CGA</title>
</head>
<body>
    <h1>Welcome!</h1>
    <div style="border: 1px solid red;">
        <form action="/insertSet" method="post">
            <!-- Campo para seleccionar el peso -->
            <div>
                <label for="peso">Peso (kg):</label>
                <select id="peso" name="peso" required>
                    <option value="10">10 kg</option>
                    <option value="20">20 kg</option>
                    <option value="30">30 kg</option>
                    <option value="50">50 kg</option>
                </select>
            </div>

            <!-- Campo para ingresar las repeticiones -->
            <div>
                <label for="repeticiones">Repeticiones:</label>
                <input type="number" id="repeticiones" name="repeticiones" min="1" required>
            </div>

            <!-- Botón para enviar el formulario -->
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
</body>
</html>
