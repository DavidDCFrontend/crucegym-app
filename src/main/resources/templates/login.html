<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" th:href="@{/styles/login.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <title>Login - CGA</title>
</head>
<body>

    <main class="layout">

        <div class="branding-container"> 
            <div class="branding-container__logo-container">
                <img class="logo-container__icon" src="/icons/icono-logo.svg" alt="Logo CruceGym App">
                <h1 class="logo-container__app-name">CruceGym App</h1>
            </div>
        </div>

        <div class="login-form-container">
            <form th:action="@{/login}" method="post" class="login-form" >
                <div class="login-form__username">
                    <label for="username-login">Nombre de usuario:</label>
                    <input type="text" name="username" id="username-login" required>
                </div>
                <div class="login-form__password">
                    <label for="password-login">Contraseña:</label>
                    <input type="password" name="password" id="password-login" required>
                    <a href="" class="password__recovery">*Recuperar contraseña</a>
                </div>
                <div class="login-form__submit">
                    <button type="submit" class="submit-container__btn">INICIAR SESIÓN</button>
                </div>
            </form>
    
            <p class="register">¿Aún no tienes cuenta? <a id="openModalBtn">¡Regístrate aquí!</a></p>
        </div>

        <!-- Ventana Modal -->
        <div id="registerModal" class="modal">
            <div class="modal-content">
                <h2 class="title">Registro</h2>
                
                <!-- Mensaje de éxito -->
                <p id="successMessage" class="success-message" style="display: none;">¡Has sido registrado con éxito! Redirigiendo a la página de inicio de sesión...</p>

                <form th:action="@{/register}" method="post" class="register-form" id="registerForm" th:object="${registrationDTO}">
                    <input type="text" id="username-register" placeholder="Tu nombre de usuario" th:field="*{username}" minlength="4" maxlength="15" required />
                    <input type="email" id="email-register" placeholder="Tu email" th:field="*{email}" required />
                    <input type="password" class="password" id="password-register" placeholder="Tu contraseña" th:field="*{password}" required />
                    <input type="password" class="password" id="confirmPassword" placeholder="Repite tu contraseña" th:field="*{passwordRepeated}" required />
                    <button type="submit">Registrarse</button>
                </form>

                <!-- Mensaje de error -->
                <p class="error-message" th:if="${error != null}" th:text="${error}"></p>

                <button id="closeModalBtn" class="close-btn">X</button>
            </div>
        </div>
        
    </main>

    <script th:src="@{/scripts/login.js}"></script>
</body>
</html>
