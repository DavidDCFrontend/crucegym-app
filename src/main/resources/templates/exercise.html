<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CGA</title>
</head>
<body>
    <h1>Welcome!</h1>
    <div style="border: 1px solid red;">
        <form th:action="@{/insertSet}" method="post" th:object="${setRegistrationDTO}">
            <!-- Campo para seleccionar el peso -->
            <div>
                <label for="weight">Peso (kg):</label>
                <select id="weight" th:field="*{weight}" required>
                    <option value="10">10 kg</option>
                    <option value="20">20 kg</option>
                    <option value="30">30 kg</option>
                    <option value="50">50 kg</option>
                </select>
            </div>

            <!-- Campo para ingresar las repeticiones -->
            <div>
                <label for="repeticiones">Repeticiones:</label>
                <input type="number" id="repeticiones" th:field="*{reps}" min="1" required>
            </div>

            <!-- Campo para ingresar el orden de la serie -->
            <div>
                <label for="order">Orden: </label>
                <input type="number" th:field="*{order}" id="order" min="0">
            </div>

            <!-- Campo para ingresar la fecha -->
            <div>
                <label for="date">Fecha: </label>
                <input type="date" id="date" th:field="*{date}" required>
            </div>

            <input type="hidden" name="idUser" th:value="*{idUser}">
            <input type="hidden" name="idExercise" th:value="*{idExercise}">

            <!-- Botón para enviar el formulario -->
            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </div>
</body>
</html>
