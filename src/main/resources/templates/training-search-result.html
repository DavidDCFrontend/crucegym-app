<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento buscado - CGA</title>
</head>
<body>

    <h2>Entrenamiento del día: <span th:text="${trainingDate}"></span></h2>

    <!-- Iterar sobre los ejercicios agrupados -->
    <div th:each="entry, iterStat : ${groupedTraining}">
        <h3 th:text="'Ejercicio ' + ${iterStat.index + 1} + ' - ' + ${entry.key}"></h3> <!-- Nombre del ejercicio con el índice -->

        <!-- Iterar sobre las series del ejercicio -->
        <div th:each="training : ${entry.value}">
            <p th:text="'Serie ' + ${training.setOrder} + ' - ' + ${training.reps} + ' repeticiones con ' + ${training.weight} + 'kg'"></p>
        </div>
    </div>

</body>
</html>
